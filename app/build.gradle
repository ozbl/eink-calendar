apply plugin: 'com.android.application'

android {
    namespace 'com.zbl.einkcalendar'
    compileSdk 36

    defaultConfig {
        applicationId "com.zbl.einkcalendar"
        minSdk 19
        targetSdk 28
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lint {
        abortOnError false
    }
}
